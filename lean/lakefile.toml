name = "lattice-line-covers-lean"
version = "0.1.0"
keywords = ["math"]
defaultTargets = ["LatticeLineCoversLean", "Challenge", "Solution"]

[leanOptions]
pp.unicode.fun = true # pretty-prints `fun a ↦ b`
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true
maxSynthPendingDepth = 3

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.33.0-rc1"

[[lean_lib]]
name = "LatticeLineCoversLean"

[[lean_lib]]
name = "Challenge"

[[lean_lib]]
name = "Solution"
