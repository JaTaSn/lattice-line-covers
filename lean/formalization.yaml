# formalization.yaml (v0.4): repo-root metadata for formalization projects.
# Written 2026-08-20 for submission to the Palomar registry (palomar-registry.org).

version: "v0.4"

project:
  name: "lattice-line-covers"
  description: >
    A Lean 4 formalization of Theorem 1 of arXiv:2608.22550: there is a family of lattice lines
    covering the integer plane whose set of realized directions is dense. Concretely, a family F
    of subsets of Z^2 is exhibited such that (i) every member is a genuine lattice line, the
    nonempty solution set of Px + Qy = c with P, Q coprime; (ii) the members cover Z^2; (iii) two
    members of different direction are disjoint, so no lattice point is covered twice in different
    directions; and (iv) the directions that occur are dense in the space RP^1 of line directions,
    that is, every angle in [0, pi) is approximated to within any epsilon by the direction of some
    member. The construction is recursive, adjoining one new direction at a time while a rigidity
    lemma and a coset lemma keep the earlier lines intact. Only Theorem 1 is formalized; the
    paper's further remarks and discussion are not.
  authors: ["Jan Snellman"]
  responsible_maintainers: ["Jan Snellman <https://orcid.org/0009-0002-6676-5068>"]
  license: "MIT"

sources:
  - title: "On the directions occurring in lattice-line coverings of the integer plane"
    authors: ["Jan Snellman"]
    id: "arXiv:2608.22550"
    type: "preprint"
    location: "Theorem 1"
    relationship: "formalizes"
    license: "CC BY 4.0"
    author_endorsement: "participated"
    note: >
      Also published, open access, as LiTH-MAT-R 2026:02, Linkoping University Electronic Press,
      DOI 10.3384/LiTH-MAT-R-2026-02 (DiVA urn:nbn:se:liu:diva-226766). The arXiv version extends
      the report with additional exposition and figures; no numbered statement differs. The
      repository itself is archived on Zenodo, DOI 10.5281/zenodo.21916621 (all versions).

repository:
  role: "substantive-development"

related_formalizations: []

classification:
  arxiv: ["math.CO", "math.NT"]
  # 05B40 primary; the rest secondary. Confirmed by the author 2026-08-25 and checked against the
  # official MSC 2020 list. Note the arXiv record still carries 05B45 + an invalid "11431"; see
  # the repository README for the correction, which rides along with any future v2.
  msc2020: ["05B40", "11H31", "52C15", "11B25", "11B57", "68V20"]

status:
  scope: >
    A family of straight lines, each through infinitely many points of Z^2, covering every
    lattice point, with no two lines of different direction sharing a lattice point, whose
    realized directions are dense in the space of line directions (RP^1). The full paper's other
    remarks and discussion are not formalized -- only Theorem 1 itself.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: ["propext", "Classical.choice", "Quot.sound"]
  main_results:
    - declaration: "Palomar.main_theorem"
      file: "Solution.lean"
      sorry_count: 0
      axioms: ["propext", "Classical.choice", "Quot.sound"]
      comparator_config: "config.json"
      literature_dependencies: []

automation:
  methods:
    - method: "agent"
      models: []  # specific model version(s) not recorded during development; left blank
                   # rather than guessed -- Jan may want to fill this in from his own records.
      framework: "Claude Code"
      tool_setup: >
        Interactive session between the author and Claude (Anthropic), plan/delegate/verify
        methodology -- see STRATEGY.md in this directory for the working process, including
        the mistakes found and fixed along the way (one caught by numerical simulation, one by
        independent review).
      prompting_notes: ""
  spend_usd: ""
  notes: >
    The mathematics was developed in a Typst working draft (../article/lattice_line_covers_pedantic.typ,
    kept in this repository unmodified) that doubled as the formalization's own guide, with
    inline "formalization status" annotations tracking progress lemma by lemma. See STRATEGY.md.

fidelity:
  divergences: >
    STATEMENT: none. The Lean statement is a verbatim restatement of Theorem 1 of the paper, in the
    Palomar namespace; see the alignment note below. No hypothesis was strengthened, no conclusion
    weakened, and nothing in Theorem 1 is left informal.

    PROOF: two divergences, both deliberate. (1) Disjointness of lines of different direction is
    argued differently. The article derives it from the Rigidity and Coset lemmas of section 2 --
    a criterion for when two individual lines meet. The formalization instead partitions each
    region into sub-cosets and carries a nested-region invariant:
    splitting_partition -> RsubCoset_disjoint_of_ne -> claims_disjoint, together with
    det_eq_zero_of_lline_eq, feeding family_valid. Rigidity and Coset are nonetheless formalized,
    as LatticeLineCovers.rigidity and LatticeLineCovers.coset in Basic.lean, for fidelity with
    section 2; they have no call site and main_theorem does not depend on them. (2) The concrete
    target sequence differs. The article's figures and verification code use an equidistributed
    golden-angle sequence; the formalization uses thetaRat (Density.lean), an enumeration of the
    rationals clamped to [0, pi). Theorem 1 asserts only that the realized directions are dense,
    and dense is all thetaRat is proved to be (thetaRat_dense) -- equidistribution is strictly
    stronger than the theorem needs, so the weaker, cheaper property was formalized instead.
    Neither divergence weakens the theorem: both are alternative routes to the same statement.

review:
  status: "author-verified"
  reviewers: ["Jan Snellman"]
  notes: >
    Independently verifiable by anyone: see ../lean/PROOF.md for exact steps (lake build, grep
    for sorry, #print axioms on the main theorem). No sorry, no custom axioms -- checked
    mechanically, not just asserted.

alignment:
  namespace: "Palomar"
  statements:
    - source: "Theorem 1 (article/lattice_line_covers_extended.tex, = arXiv:2608.22550)"
      lean: "Palomar.main_theorem"
      module: "Solution.lean"
      status: "proved"
      note: >
        The statement in Challenge.lean/Solution.lean is a verbatim copy of
        LatticeLineCoversLean.Family.main_theorem's type, restated in the Palomar namespace to
        avoid a declaration clash between the challenge module's own copies of lline/direction/
        rpDist and the main project's. Solution.lean proves the copies are definitionally equal
        (rfl) to the main project's and discharges the goal via LatticeLineCovers.main_theorem.

acknowledgements: >
  This problem occurred to the author during an idle conversation with colleagues about covering
  the lattice Z^2 with lines. The reformulation, the rigidity and coset lemmas, the recursive
  construction, and both rounds of error-correction (one caught by numerical simulation, one by
  independent review) were found by Claude (Anthropic), working with the author in an interactive
  session. The author directed the exposition, checked the final manuscript, and assumes full
  responsibility for any errors or gaps that remain.
